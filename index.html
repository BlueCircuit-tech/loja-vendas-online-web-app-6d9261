<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Zum — Mobilidade Urbana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#EEF3FB', 100: '#D4DFF4', 200: '#A9BFE9',
              300: '#7E9FDE', 400: '#538FD3', 500: '#2563EB',
              600: '#1D4ED8', 700: '#1E3A5F', 800: '#15294A',
              900: '#0C1934',
            },
            destaque: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' },
            ok:    { 50: '#ECFDF5', 500: '#10B981', 600: '#059669', 700: '#047857' },
            erro:  { 50: '#FEF2F2', 500: '#EF4444', 600: '#DC2626', 700: '#B91C1C' },
            aviso: { 50: '#FFF7ED', 500: '#F97316', 600: '#EA580C' },
            info:  { 50: '#EFF6FF', 500: '#3B82F6', 600: '#2563EB' },
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            body:    ['"DM Sans"', 'sans-serif'],
          },
          boxShadow: {
            marca: '0 2px 16px rgba(30,58,95,0.12)',
            card:  '0 1px 8px rgba(30,58,95,0.08)',
            up:    '0 -2px 16px rgba(30,58,95,0.10)',
          },
          borderRadius: { '2xl': '1rem', '3xl': '1.25rem' },
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'DM Sans', sans-serif; background: #0f172a; overscroll-behavior: none; }

    .screen { display: none; animation: telaEntrada .32s ease-out both; }
    .screen.aberta { display: block; }
    @keyframes telaEntrada {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .nav-btn { transition: color .18s, background .18s; }
    .nav-btn.ativo { color: #2563EB; }
    .nav-btn.ativo svg { stroke: #2563EB; }
    .nav-item { transition: color .18s; }
    .nav-item.ativo { color: #2563EB; }

    #toasts { position: fixed; top: env(safe-area-inset-top, 12px); left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 24px); max-width: 360px; pointer-events: none; }
    .toast-item { animation: toastIn .3s ease-out both; pointer-events: auto; }
    .toast-item.sair { animation: toastOut .28s ease-in both; }
    @keyframes toastIn  { from { opacity: 0; transform: translateY(-16px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-12px) scale(.94); } }

    #modal-wrap { position: fixed; inset: 0; z-index: 8000; display: none; align-items: flex-end; justify-content: center; background: rgba(15,23,42,.55); backdrop-filter: blur(3px); }
    #modal-wrap.aberto { display: flex; animation: modalFundoIn .2s ease-out; }
    @keyframes modalFundoIn { from { opacity: 0; } to { opacity: 1; } }
    #modal-card { animation: modalCardIn .28s ease-out; }
    @keyframes modalCardIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: .7rem; font-weight: 600; letter-spacing: .02em; }
    .card  { background: #fff; border-radius: 1rem; padding: 16px; box-shadow: 0 1px 8px rgba(30,58,95,.08); }
    .btn   { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 24px; border-radius: .75rem; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: .9rem; border: none; cursor: pointer; transition: background .18s, transform .12s, box-shadow .18s; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #2563EB; color: #fff; box-shadow: 0 2px 12px rgba(37,99,235,.35); }
    .btn-primary:hover { background: #1D4ED8; }
    .btn-outline { background: transparent; color: #1E3A5F; border: 1.5px solid #CBD5E1; }
    .btn-outline:hover { border-color: #2563EB; color: #2563EB; }
    .btn-ghost { background: rgba(37,99,235,.08); color: #2563EB; }
    .btn-ghost:hover { background: rgba(37,99,235,.15); }
    .btn-success { background: #10B981; color: #fff; }
    .btn-danger  { background: #EF4444; color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: .8rem; border-radius: .5rem; }

    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }

    .app-frame {
      position: relative; width: 100%; max-width: 390px; height: 100dvh;
      background: #F8FAFC; overflow: hidden; display: flex; flex-direction: column;
    }
    @media (min-width: 768px) {
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .app-frame {
        height: min(844px, 100dvh); border-radius: 32px;
        border: 6px solid #1E3A5F; box-shadow: 0 25px 80px rgba(15,23,42,.45), 0 0 0 2px rgba(37,99,235,.2);
      }
    }
  </style>
</head>
<body class="bg-slate-900 flex justify-center">

  <div class="app-frame">

    <!-- ─── BARRA DE STATUS ─── -->
    <header class="shrink-0 flex items-center justify-between px-7 py-2 bg-marca-700 select-none" style="padding-top: env(safe-area-inset-top,.5rem);">
      <span class="text-white/90 text-xs font-body font-semibold tracking-wide" id="relogio">--:--</span>
      <div class="flex items-center gap-1.5">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l15.5 7L23 3"/><path d="M1 12l16 7L23 9"/><path d="M1 18l16 7L23 15"/></svg>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><rect x="1" y="6" width="18" height="12" rx="2"/><path d="M23 13v-2" stroke-linejoin="round"/></svg>
        <div class="w-7 h-4 rounded-[3px] border border-white/40 relative ml-0.5">
          <div class="absolute inset-[2px] rounded-[1px] bg-green-400" id="icone-bateria"></div>
        </div>
      </div>
    </header>

    <!-- ─── LOGO ─── -->
    <div class="shrink-0 flex items-center gap-2.5 px-5 py-3 bg-white border-b border-slate-200/70">
      <svg width="34" height="34" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="12" fill="#1E3A5F"/>
        <path d="M13 30 L26 18 L30 22" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M28 22 H38" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="14" cy="33" r="3" fill="#F8FAFC" opacity=".9"/>
        <circle cx="38" cy="15" r="3" fill="#2563EB"/>
        <path d="M10 36 Q14 32 18 36" stroke="#F8FAFC" stroke-width="1.5" fill="none" opacity=".5" stroke-linecap="round"/>
      </svg>
      <div>
        <span class="font-display font-bold text-marca-700 text-lg leading-none block">Zum</span>
        <span class="font-body text-[10px] text-marca-400 font-medium tracking-widest uppercase leading-none mt-0.5 block">Mobilidade Urbana</span>
      </div>
    </div>

    <!-- ─── CONTEÚDO PRINCIPAL ─── -->
    <main id="conteudo" class="flex-1 overflow-y-auto bg-slate-50">

      <!-- ═══════════════════════════════════════════ -->
      <!-- TELAS – cada tela será injetada aqui        -->
      <!-- ═══════════════════════════════════════════ -->
      <!-- TELAS -->

    </main>

    <!-- ─── NAVEGAÇÃO INFERIOR ─── -->
    <nav class="shrink-0 bg-white border-t border-slate-200/70 flex items-center justify-around pb-2 pt-1 px-1" style="padding-bottom: env(safe-area-inset-bottom,.5rem);">

      <button class="nav-btn nav-item ativo flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl" data-nav="home-passageiro" onclick="mostrarTela('home-passageiro')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="text-[10px] font-semibold">Início</span>
      </button>

      <button class="nav-btn nav-item flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl text-slate-400" data-nav="tarifa-e-rota" onclick="mostrarTela('tarifa-e-rota')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 10-16 0c0 3 2.7 7 8 11.7z"/></svg>
        <span class="text-[10px] font-semibold">Rota</span>
      </button>

      <button class="nav-btn nav-item flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl text-slate-400" data-nav="acompanhar-corrida" onclick="mostrarTela('acompanhar-corrida')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        <span class="text-[10px] font-semibold">Corrida</span>
      </button>

      <button class="nav-btn nav-item flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl text-slate-400" data-nav="pagamento" onclick="mostrarTela('pagamento')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span class="text-[10px] font-semibold">Pagamento</span>
      </button>

      <button class="nav-btn nav-item flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl text-slate-400" data-nav="notificacoes" onclick="mostrarTela('notificacoes')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="text-[10px] font-semibold">Avisos</span>
      </button>
    </nav>
  </div>

  <!-- ─── TOASTS ─── -->
  <div id="toasts" aria-live="polite"></div>

  <!-- ─── MODAL ─── -->
  <div id="modal-wrap" onclick="if(event.target===this)fecharModal()">
    <div id="modal-card" class="bg-white rounded-t-3xl w-full max-w-[390px] max-h-[80vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 shrink-0">
        <h3 id="modal-titulo" class="font-display font-bold text-marca-700 text-lg"></h3>
        <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition-colors" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-corpo" class="overflow-y-auto p-5"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- ROTEADOR & UTILITÁRIOS                                       -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <script>
    /* ── Roteador ── */
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
        if (s.dataset.tela === id) {
          s.classList.add('aberta');
          s.style.animation = 'none';
          s.offsetHeight;
          s.style.animation = '';
        }
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
        if (b.dataset.nav === id) {
          b.classList.add('ativo');
        } else {
          b.classList.remove('ativo');
        }
      });
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('home-passageiro');
      relogioTick();
      setInterval(relogioTick, 15000);
    });

    /* ── Relógio da barra de status ── */
    function relogioTick() {
      var d = new Date();
      var h = String(d.getHours()).padStart(2, '0');
      var m = String(d.getMinutes()).padStart(2, '0');
      var el = document.getElementById('relogio');
      if (el) el.textContent = h + ':' + m;
    }

    /* ── Toasts ── */
    var toastTimer = null;
    function toast(mensagem, tipo) {
      var container = document.getElementById('toasts');
      var cores = { ok: 'border-l-4 border-ok-500 bg-ok-50', erro: 'border-l-4 border-erro-500 bg-erro-50', info: 'border-l-4 border-info-500 bg-info-50' };
      var icones = {
        ok:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        erro:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      };
      var div = document.createElement('div');
      div.className = 'toast-item flex items-center gap-3 p-3 rounded-xl shadow-marca ' + (cores[tipo] || cores.info);
      div.innerHTML = '<div class="shrink-0 mt-0.5">' + (icones[tipo] || icones.info) + '</div><p class="text-sm font-medium text-slate-700 flex-1">' + mensagem + '</p>';
      container.appendChild(div);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        div.classList.add('sair');
        setTimeout(function () { div.remove(); }, 300);
      }, 3000);
    }

    /* ── Modal ── */
    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-corpo').innerHTML = html;
      var wrap = document.getElementById('modal-wrap');
      wrap.classList.add('aberto');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal() {
      var wrap = document.getElementById('modal-wrap');
      wrap.classList.remove('aberto');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });

    /* ── Formatadores ── */
    function brl(valor) {
      return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
    }
    function dataBR(iso) {
      if (!iso) return '--/--/----';
      var p = iso.split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }
  </script>

</body>
</html>
